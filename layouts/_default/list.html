{{ define "bodyclass" }}archive{{ end }}
{{ define "main" }}
<section id="content" class="container row">
    <div id="article" class="twelve columns offset-by-two omega">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
        {{ range .Pages }}
        <div class="post">
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        </div>
        {{ end }}
    </div><!-- ends article -->
</section><!-- ends content -->
{{ end }}
